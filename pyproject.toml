[project]
name = "marvin-ai-google"
version = "0.1.0"
description = "Google Gemini for Marvin: the Gemini API (google-genai) as an AI provider plugin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.8: the AI provider contract (AIProvider, AIProviderPlugin, Credential, ModelPrice) and its conformance kit.
    "marvin-integration-sdk>=0.8,<1",
    # 1.x: the unified google-genai SDK (the successor of the deprecated google-generativeai).
    "google-genai>=1.56,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/InnerOpen/marvin-ai-google"

# The seam that makes the plugin discoverable: Marvin scans this group at startup. Each slug replaces core's
# built-in provider of the same name.
[project.entry-points."marvin.ai_providers"]
google = "marvin_ai_google:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_ai_google"]

# Dev only: the SDK commit Marvin core pins (pyproject.toml there), so tests run against the contract the
# image ships. Released installs take the SDK from plugins.packages / the index.
[tool.uv.sources]
marvin-integration-sdk = { git = "https://github.com/InnerOpen/marvin-integration-sdk", rev = "39c49208defe5feaa1a9c59a7aa9b0d9fd2c0a60" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Gemini API (GOOGLE_API_KEY); skipped when unset"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
